      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "1d0db38904205bec4d6f6f6a1f6cec3e", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "42b42a8ab0e31162bcfefd8f89ff2395", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8cb4fdff65e3e21c6458456beb3f8d9f", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "440be80cd85264c5c1461967f38ed88c", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6177dd9d948cc3b764bdc670855d639d", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f194ead0313283d8bcd7a313fae5492f", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e4ce37b32912003934f36d3c60f25edf", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "91465dd3b763be4edba7aff63a603dca", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cmarimo-callout-output data-html='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;h1 id=\u0026#92;\u0026quot;modelos-de-lenguaje\u0026#92;\u0026quot;\u0026gt;Modelos de lenguaje\u0026lt;/h1\u0026gt;\u0026#92;n\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Los modelos de lenguaje se basan en la estimaci\u00f3n de distribuciones de\u0026#92;nprobabilidad para cada uno de los documentos de un corpus.\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-kind='\u0026quot;neutral\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}, {"code_hash": "6108a1e531bd762d85b88a2444308e7e", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEl estimador de \u003Cstrong\u003EM\u00e1xima Verosimilitud (MLE)\u003C/strong\u003E se define como:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(t|\\theta_{i}) = \\frac{f(t,d_i)}{|d_i|}||)\u003C/marimo-tex\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003Edonde \u003Cmarimo-tex class=\"arithmatex\"\u003E||(t||)\u003C/marimo-tex\u003E es un t\u00e9rmino del vocabulario, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\theta_i||)\u003C/marimo-tex\u003E es el modelo de lenguaje del documento \u003Cmarimo-tex class=\"arithmatex\"\u003E||(d_i||)\u003C/marimo-tex\u003E, y \u003Cmarimo-tex class=\"arithmatex\"\u003E||(|d_i|||)\u003C/marimo-tex\u003E es la longitud del documento (suma de las frecuencias de todos sus t\u00e9rminos).\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EEjemplo:\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EDados los documentos:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003Ed1\u003C/strong\u003E = [casa, perro, gato], \u003Cmarimo-tex class=\"arithmatex\"\u003E||(|d_1| = 3||)\u003C/marimo-tex\u003E\u003Cbr\u003E\n\u003Cstrong\u003Ed2\u003C/strong\u003E = [casa, perro, loro, casa], \u003Cmarimo-tex class=\"arithmatex\"\u003E||(|d_2| = 4||)\u003C/marimo-tex\u003E\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003EEl modelo de lenguaje de cada documento se computa como:\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(casa|\\theta_{d1}) = \\frac{f(casa,d_1)}{|d_1|} = \\frac{1}{3} = 0.33||)\u003C/marimo-tex\u003E\u003Cbr\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(perro|\\theta_{d1}) = \\frac{f(perro,d_1)}{|d_1|} = \\frac{1}{3} = 0.33||)\u003C/marimo-tex\u003E\u003Cbr\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(gato|\\theta_{d1}) = \\frac{f(gato,d_1)}{|d_1|} = \\frac{1}{3} = 0.33||)\u003C/marimo-tex\u003E\u003Cbr\u003E\u003Cbr\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(casa|\\theta_{d2}) = \\frac{f(casa,d_2)}{|d_2|} = \\frac{2}{4} = 0.5||)\u003C/marimo-tex\u003E\u003Cbr\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(perro|\\theta_{d2}) = \\frac{f(perro,d_2)}{|d_2|} = \\frac{1}{4} = 0.25||)\u003C/marimo-tex\u003E\u003Cbr\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(loro|\\theta_{d2}) = \\frac{f(loro,d_2)}{|d_2|} = \\frac{1}{4} = 0.25||)\u003C/marimo-tex\u003E\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003E\u00bfCu\u00e1l es la probabilidad de \"casa\" en cada documento?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(casa|\\theta_{d1}) = \\frac{f(casa,d_1)}{|d_1|} = \\frac{1}{3} = 0.33||)\u003C/marimo-tex\u003E\u003Cbr\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(casa|\\theta_{d2}) = \\frac{f(casa,d_2)}{|d_2|} = \\frac{2}{4} = 0.5||)\u003C/marimo-tex\u003E\u003C/span\u003E\n\u003Chr /\u003E\n\u003Cspan class=\"paragraph\"\u003E\u00bfCu\u00e1l es la probabilidad de \"casa\" en la colecci\u00f3n?\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EC\u003C/strong\u003E = [casa, perro, gato, casa, perro, loro, casa] \u0026nbsp;\u2192\u0026nbsp; \u003Cmarimo-tex class=\"arithmatex\"\u003E||(|C| = 7||)\u003C/marimo-tex\u003E\u003Cbr\u003E\u003Cbr\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||(P(casa|\\theta_C) = \\frac{f(casa,C)}{|C|} = \\frac{3}{7} = 0.43||)\u003C/marimo-tex\u003E\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "91d569d1346917d55f817a930a085834", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"query-likelihood\"\u003EQuery likelihood\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EDada una consulta \u003Cmarimo-tex class=\"arithmatex\"\u003E||(q||)\u003C/marimo-tex\u003E, permite \u003Cem\u003Erankear\u003C/em\u003E los documentos acorde a la probabilidad de que cada\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\theta_i||)\u003C/marimo-tex\u003E genere \u003Cmarimo-tex class=\"arithmatex\"\u003E||(q||)\u003C/marimo-tex\u003E. Se computa como:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[P(q|d_i) = P(q|\\theta_i) = \\prod_{t \\in q} P(t|\\theta_i)||]\u003C/marimo-tex\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "052f126c4b0a0cd671e7267496749bd9", "console": [], "id": "Kclp", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEjemplo: dada la siguiente matriz t\u00e9rmino-documento.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='Kclp-0' random-id='608ccf02-fd6a-7428-062e-0918b7c121a2'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Matriz Termino-Documento con \u0026lt;marimo-tex class=\u0026#92;\u0026quot;arithmatex\u0026#92;\u0026quot;\u0026gt;||(w_{ji} = fr_{ij}||)\u0026lt;/marimo-tex\u0026gt;\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-data='\u0026quot;[{\u0026#92;\u0026quot;\u0026#92;\u0026quot;:\u0026#92;\u0026quot;gato\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Doc1\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;Doc2\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;Doc3\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;Doc4\u0026#92;\u0026quot;:0},{\u0026#92;\u0026quot;\u0026#92;\u0026quot;:\u0026#92;\u0026quot;negro\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Doc1\u0026#92;\u0026quot;:1,\u0026#92;\u0026quot;Doc2\u0 E||(\u03b8_q||)\u003C/marimo-tex\u003E y \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\u03b8_i||)\u003C/marimo-tex\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[KL(\\theta_q | \\theta_i) = \\sum_{t} P(t|\\theta_q) \\cdot \\log \\frac{P(t|\\theta_q)}{P(t|\\theta_i)}||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EUn \u003Cstrong\u003Emenor\u003C/strong\u003E \u003Cmarimo-tex class=\"arithmatex\"\u003E||(KL(\\theta_q|\\theta_i)||)\u003C/marimo-tex\u003E implica una menor distancia entre el modelo de la consulta y el del documento. Esto, a su vez, indica mayor similitud entre ambos.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1a8e3d572e26b04c888639dac930e0b8", "console": [], "id": "aLJB", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f8c01fb80b2c888a5fe4ee1ea7fa5e06", "console": [], "id": "nHfw", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='nHfw-0' random-id='2b4bf157-ab38-44b5-fe1d-bde0f48326ec'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;span class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026gt;Dirichlet Priors \u0026lt;marimo-tex class=\u0026#92;\u0026quot;arithmatex\u0026#92;\u0026quot;\u0026gt;||(\u0026#92;\u0026#92;mu = 1000||)\u0026lt;/marimo-tex\u0026gt;\u0026lt;/span\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-data='\u0026quot;[{\u0026#92;\u0026quot;\u0026#92;\u0026quot;:\u0026#92;\u0026quot;gato\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Doc1\u0026#92;\u0026quot;:0.2999,\u0026#92;\u0026quot;Doc2\u0026#92;\u0026quot;:0.3005,\u0026#92;\u0026quot;Doc3\u0026#92;\u0026quot;:0.2999,\u0026#92;\u0026quot;Doc4\u0026#92;\u0026quot;:0.2997},{\u00
