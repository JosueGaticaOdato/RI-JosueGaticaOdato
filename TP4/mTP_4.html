      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "1d0db38904205bec4d6f6f6a1f6cec3e", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "5ffa4fadb26c9b79067e4d7f4ea774ed", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "aa2cfff58d7f61eb6812b2c400e2b178", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "\u003Cmarimo-callout-output data-html='\u0026quot;\u0026lt;span class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026gt;\u0026lt;h1 id=\u0026#92;\u0026quot;indices-invertidos-estructuras-de-datos-algoritmos-de-interseccion-y-procesamiento-de-consultas\u0026#92;\u0026quot;\u0026gt;\u00cdndices Invertidos: Estructuras de Datos, Algoritmos de Intersecci\u00f3n y Procesamiento de Consultas\u0026lt;/h1\u0026gt;\u0026#92;n\u0026lt;table\u0026gt;\u0026#92;n\u0026lt;thead\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;th\u0026gt;Secci\u00f3n\u0026lt;/th\u0026gt;\u0026#92;n\u0026lt;th\u0026gt;Contenido\u0026lt;/th\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;/thead\u0026gt;\u0026#92;n\u0026lt;tbody\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;1\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;Almacenamiento binario con \u0026lt;code\u0026gt;struct\u0026lt;/code\u0026gt;\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;2\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;Construcci\u00f3n y lectura de un \u00edndice invertido en disco\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;3\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;Posting lists: modelo de cursor y API\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;4\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;Operadores booleanos: AND, OR, NOT sobre posting lists\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;5\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;B\u00fasqueda binaria y \u0026lt;em\u0026gt;galloping search\u0026lt;/em\u0026gt;\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;6\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;Procesamiento de consultas booleanas\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;7\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;Algoritmos: TAAT y DAAT\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;tr\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;8\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;td\u0026gt;Construcci\u00f3n de \u00edndice por bloques: BSBI\u0026lt;/td\u0026gt;\u0026#92;n\u0026lt;/tr\u0026gt;\u0026#92;n\u0026lt;/tbody\u0026gt;\u0026#92;n\u0026lt;/table\u0026gt;\u0026lt;/span\u0026gt;\u0026quot;' data-kind='\u0026quot;neutral\u0026quot;'\u003E\u003C/marimo-callout-output\u003E"}, "type": "data"}]}, {"code_hash": "fccf398aeaef6082ddeebf1902f8cf2f", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"1-almacenamiento-binario-con-struct\"\u003E1. Almacenamiento Binario con \u003Ccode\u003Estruct\u003C/code\u003E\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EEl m\u00f3dulo \u003Ccode\u003Estruct\u003C/code\u003E de Python permite \u003Cstrong\u003Eserializar y deserializar datos binarios\u003C/strong\u003E\na partir de tipos Python nativos, usando una cadena de formato (\u003Cem\u003Eformat string\u003C/em\u003E).\u003C/span\u003E\n\u003Ch3 id=\"cadenas-de-formato-mas-usadas-en-ir\"\u003ECadenas de formato m\u00e1s usadas en IR\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EC\u00f3digo\u003C/th\u003E\n\u003Cth\u003ETipo C\u003C/th\u003E\n\u003Cth\u003EBytes\u003C/th\u003E\n\u003Cth\u003ERango (unsigned)\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EH\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eunsigned short\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E2\u003C/td\u003E\n\u003Ctd\u003E0 \u2013 65 535  (2\u00b9\u2076 \u2212 1)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EI\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eunsigned int\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E4\u003C/td\u003E\n\u003Ctd\u003E0 \u2013 4 294 967 295  (2\u00b3\u00b2 \u2212 1)\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003EQ\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Eunsigned long long\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E8\u003C/td\u003E\n\u003Ctd\u003E0 \u2013 2\u2076\u2074 \u2212 1\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EEl prefijo \u003Cstrong\u003E\u003Ccode\u003E\u0026gt;\u003C/code\u003E\u003C/strong\u003E indica \u003Cstrong\u003Ebig-endian\u003C/strong\u003E: el byte m\u00e1s significativo se almacena\nprimero. Es la convenci\u00f3n est\u00e1ndar en protocolos de red y archivos portables\nentre plataformas.\u003C/span\u003E\n\u003Ch3 id=\"funciones-principales\"\u003EFunciones principales\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EFunci\u00f3n\u003C/th\u003E\n\u003Cth\u003EDirecci\u00f3n\u003C/th\u003E\n\u003Cth\u003EResultado\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Estruct.pack(fmt, *vals)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EPython \u2192 \u003Ccode\u003Ebytes\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003ESerializa valores a binario\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Estruct.unpack(fmt, buf)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u003Ccode\u003Ebytes\u003C/code\u003E \u2192 \u003Ccode\u003Etuple\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EDeserializa bytes \u2192 tupla Python\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Estruct.calcsize(fmt)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003E\u2014\u003C/td\u003E\n\u003Ctd\u003EBytes que ocupa el formato\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ccode\u003Estruct.unpack\u003C/code\u003E \u003Cstrong\u003Esiempre retorna una tupla\u003C/strong\u003E, incluso para un solo valor.\nPara recuperar el valor se accede al primer elemento: \u003Ccode\u003Estruct.unpack('H', x)[0]\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "ac4da223d139e020b4568ad7004f553a", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"c1\"\u003E# \u0026#39;H\u0026#39; = unsigned short = 2 bytes \u2014 rango [0, 65535]\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ex\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"nb\"\u003Ebytes\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Estruct\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Epack\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"s1\"\u003E\u0026#39;H\u0026#39;\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E65535\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"nb\"\u003Eprint\u003C/span\u003E\u003C traceback": [], "type": "error"}]}, {"code_hash": "ad34b6b18d10a53e4aa9a4086842f68e", "console": [], "id": "qnkX", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"4-posting-list-modelo-de-cursor\"\u003E4. Posting List: Modelo de Cursor\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EUna posting list es una \u003Cstrong\u003Esecuencia ordenada de document IDs\u003C/strong\u003E junto con\ninformaci\u00f3n asociada (frecuencia, peso TF-IDF, etc.).\nLa forma can\u00f3nica de recorrerla es mediante un \u003Cstrong\u003Ecursor\u003C/strong\u003E (puntero interno)\nque avanza de forma \u003Cstrong\u003Emonot\u00f3nica\u003C/strong\u003E \u2014 nunca retrocede.\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EPosting list del t\u00e9rmino \u0026quot;lluvia\u0026quot;:\n\n\u00edndice:   0     1     2     3     4     5   ...\n       \u250c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2510\ndocid: \u2502  5  \u2502 10  \u2502 14  \u2502 18  \u2502 19  \u2502 20  \u2502 ...\n       \u2514\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2518\n          \u2191\n       cursor = 0   \u2192  docid() = 5\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ETras llamar a \u003Ccode\u003Enext()\u003C/code\u003E:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E       \u250c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2510\ndocid: \u2502  5  \u2502 10  \u2502 14  \u2502 18  \u2502 19  \u2502 20  \u2502 ...\n       \u2514\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2518\n                \u2191\n             cursor = 1   \u2192  docid() = 10\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ECuando el cursor supera el \u00faltimo elemento se pone en \u003Cstrong\u003E-1\u003C/strong\u003E\n(bandera de \"fin de lista\"), y \u003Ccode\u003Edocid()\u003C/code\u003E retorna \u003Ccode\u003ENone\u003C/code\u003E.\u003C/span\u003E\n\u003Ch3 id=\"por-que-un-cursor\"\u003E\u00bfPor qu\u00e9 un cursor?\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003EPermite \u003Cstrong\u003Emezclar m\u00faltiples listas\u003C/strong\u003E en O(n\u2081 + n\u2082) sin materializar\n  la intersecci\u00f3n completa.\u003C/li\u003E\n\u003Cli\u003EEl avance monot\u00f3nico garantiza que cada elemento se procesa\n  \u003Cstrong\u003Ea lo sumo una vez\u003C/strong\u003E.\u003C/li\u003E\n\u003Cli\u003EEl m\u00e9todo \u003Ccode\u003Ege(d)\u003C/code\u003E (\u003Cem\u003Egreater-or-equal\u003C/em\u003E) es la clave de los algoritmos\n  de intersecci\u00f3n eficientes: salta directamente a un docID objetivo.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3 id=\"api-minima\"\u003EAPI m\u00ednima\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EM\u00e9todo\u003C/th\u003E\n\u003Cth\u003EComplejidad\u003C/th\u003E\n\u003Cth\u003EDescripci\u00f3n\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Edocid()\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EO(1)\u003C/td\u003E\n\u003Ctd\u003EdocID actual; \u003Ccode\u003ENone\u003C/code\u003E si cursor = \u22121\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Enext()\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EO(1)\u003C/td\u003E\n\u003Ctd\u003EAvanza el cursor un paso\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Eweight()\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EO(1)\u003C/td\u003E\n\u003Ctd\u003EPeso del documento actual\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ege(d)\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EO(?) *\u003C/td\u003E\n\u003Ctd\u003EAvanza hasta el primer docID \u2265 d\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Ccode\u003Ereset()\u003C/code\u003E\u003C/td\u003E\n\u003Ctd\u003EO(1)\u003C/td\u003E\n\u003Ctd\u003EReinicia el cursor al inicio\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cul\u003E\n\u003Cli\u003ELa complejidad de \u003Ccode\u003Ege()\u003C/code\u003E depende de la estrategia:\nlineal O(n), binaria O(log n), galloping O(log d).\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "2fa5a4f11073707ad5c04192adf94090", "console": [], "id": "TqIu", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"interfaz-abstracta-de-postinglist\"\u003EInterfaz abstracta de PostingList\u003C/h3\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"kn\"\u003Efrom\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nn\"\u003Eabc\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"kn\"\u003Eimport\u003C/span\u003E \u003Cspan class=\"n\"\u003EABC\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Eabstractmethod\u003C/span\u003E\n\u003Cspan class=\"kn\"\u003Efrom\u003C/span\u003E\u003Cspan class=\"w\" \"\u003E]:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;Peso del documento actual (TF-IDF, BM25, etc.).\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Epass\u003C/span\u003E\n\n    \u003Cspan class=\"nd\"\u003E@abstractmethod\u003C/span\u003E\n    \u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Enext\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"kc\"\u003ENone\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;Avanza al siguiente documento. Cursor \u2192 -1 si no hay m\u00e1s.\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Epass\u003C/span\u003E\n\n    \u003Cspan class=\"nd\"\u003E@abstractmethod\u003C/span\u003E\n    \u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Ege\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Edocid\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"nb\"\u003Eint\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"nb\"\u003Eint\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n\u003Cspan class=\"sd\"\u003E        Retorna el primer docID \u0026gt;= docid usando la estrategia configurada.\u003C/span\u003E\n\u003Cspan class=\"sd\"\u003E        Mueve el cursor a esa posici\u00f3n (o a -1 si no existe).\u003C/span\u003E\n\u003Cspan class=\"sd\"\u003E        \u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Epass\u003C/span\u003E\n\n    \u003Cspan class=\"nd\"\u003E@abstractmethod\u003C/span\u003E\n    \u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Ereset\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"kc\"\u003ENone\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;Reinicia el cursor al inicio de la lista.\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Epass\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6f23b2d4d7d76ee78bfb56ceb8d310e1", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"implementacion-clase-postinglist\"\u003EImplementac\u00ed\u00f3n Clase PostingList\u003C/h3\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"k\"\u003Eclass\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nc\"\u003EInMemoryPosting\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003EPostingList\u003C/span\u003E\u003Cspan class=\"p\"\u003E):\u003C/span\u003E\n\n    \u003Cspan class=\"n\"\u003Edocids\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"n\"\u003EList\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"nb\"\u003Eint\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Eweights\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"n\"\u003EList\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"nb\"\u003Efloat\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"kc\"\u003ENone\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Ecursor\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"nb\"\u003Eint\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\n\n\n    \u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003E__post_init__\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E):\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Eif\u003C/span\u003E \u003Cspan class=\"ow\"\u003Enot\u003C/span\u003E \u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Edocids\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n            \u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Ecursor\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "410b1485aa4dba261dc9632fa9c5bc6a", "console": [], "id": "DnEU", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "346c3a2051548e98985dfd98c0005c99", "console": [], "id": "ulZA", "outputs": [{"ename": "exception", "evalue": "An ancestor raised an exception (FileNotFoundError): ", "traceback": [], "type": "error"}]}, {"code_hash": "cd910bd3aaab91fb15322a7beab2b76b", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"5-busqueda-binaria-y-galloping-search-en-posting-lists\"\u003E5. B\u00fasqueda Binaria y Galloping Search en Posting Lists\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EEl m\u00e9todo \u003Ccode\u003Ege(d)\u003C/code\u003E es el n\u00facleo de los algoritmos de intersecci\u00f3n.\nTres estrategias de implementaci\u00f3n:\u003C/span\u003E\n\u003Ch3 id=\"51-busqueda-lineal-naive\"\u003E5.1 B\u00fasqueda Lineal (naive)\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EAvanza el cursor de a uno hasta encontrar el primer docID \u2265 d.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EComplejidad\u003C/strong\u003E: O(n) en el peor caso\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EVentaja\u003C/strong\u003E: Muy simple; eficiente si el target est\u00e1 cerca del cursor\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EDesventaja\u003C/strong\u003E: Ineficiente para listas largas con targets lejanos\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3 id=\"52-busqueda-binaria\"\u003E5.2 B\u00fasqueda Binaria\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EDivide el subarreglo \u003Ccode\u003E[cursor, end]\u003C/code\u003E a la mitad en cada paso.\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ELista:  [ 5, 10, 14, 18, 19, 20, 33, 45, 60, 80 ]\n          \u2191 cursor=0                              \u2191 hi=9\n\nBuscar ge(33):\npaso 1: mid=4 \u2192 docids[4]=19 \u0026lt; 33 \u2192 lo=5\npaso 2: mid=7 \u2192 docids[7]=45 \u0026gt; 33 \u2192 hi=6\npaso 3: mid=5 \u2192 docids[5]=20 \u0026lt; 33 \u2192 lo=6\npaso 4: mid=6 \u2192 docids[6]=33 == 33 \u2192 encontrado \u2713\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EComplejidad\u003C/strong\u003E: O(log n) donde n = longitud de la lista desde el cursor\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EVentaja\u003C/strong\u003E: Independiente de la distancia al target\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EDesventaja\u003C/strong\u003E: No aprovecha que el cursor ya est\u00e1 cerca del target\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3 id=\"53-galloping-search-exponential-search\"\u003E5.3 Galloping Search (Exponential Search)\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EFase 1 \u2014 galloping\u003C/strong\u003E: duplica el salto hasta superar el target (bound = 1, 2, 4, 8, \u2026)\n\u003Cstrong\u003EFase 2 \u2014 refinamiento\u003C/strong\u003E: b\u00fasqueda binaria en el intervalo \u003Ccode\u003E[lo, hi]\u003C/code\u003E\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ELista:  [ 5, 10, 14, 18, 19, 20, 33, 45, 60, 80 ]\n          \u2191 cursor=0\n\nBuscar ge(33):\nFase 1 (galloping):\n  cursor=0, step=1:\n    hi=1 \u2192 docids[1]=10 \u0026lt; 33 \u2192 lo=2, step=2\n  step=2, lo=2:\n    hi=4 \u2192 docids[4]=19 \u0026lt; 33 \u2192 lo=5, step=4\n  step=4, lo=5:\n    hi=9 \u2192 docids[9]=80 \u2265 33 \u2192 parar\n\nResultado: lo=5, hi=9\n\nFase 2 (binaria en [5, 9]):\n  mid=7 \u2192 45 \u2265 33 \u2192 hi=7\n  mid=6 \u2192 33 == 33 \u2192 encontrado \u2713\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EComplejidad\u003C/strong\u003E: O(log d) donde d = distancia entre cursor y target\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EVentaja\u003C/strong\u003E: \u00d3ptimo cuando la lista \"peque\u00f1a\" gu\u00eda a la lista \"grande\"\n  (intersecci\u00f3n de listas de distinto tama\u00f1o)\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "245ce7502898f402213eefbd4414a71c", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8e45bd2d7bdc1a1d91945a1e70851fa7", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "41667695ad8878c0d8a23a499b48891f", "console": [], "id": "aLJB", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"comparacion-de-estrategias\"\u003EComparaci\u00f3n de estrategias\u003C/h3\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EEstrategia\u003C/th\u003E\n\u003Cth\u003EComplejidad\u003C/th\u003E\n\u003Cth\u003EMejor caso\u003C/th\u003E\n\u003Cth\u003EPeor caso\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ELineal\u003C/td\u003E\n\u003Ctd\u003EO(n)\u003C/td\u003E\n\u003Ctd\u003ETarget cerca del cursor\u003C/td\u003E\n\u003Ctd\u003ETarget al final\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EBinaria\u003C/td\u003E\n\u003Ctd\u003EO(log n)\u003C/td\u003E\n\u003Ctd\u003EUniforme\u003C/td\u003E\n\u003Ctd\u003EIgual que mejor caso\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003EGalloping\u003C/td\u003E\n\u003Ctd\u003EO(log d)\u003C/td\u003E\n\u003Ctd\u003ETarget cerca del cursor\u003C/td\u003E\n\u003Ctd\u003ETarget al final (= O(log n))\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ERegla pr\u00e1ctica\u003C/strong\u003E: usar galloping cuando se intersectan listas de muy distinto\ntama\u00f1o (la lista corta gu\u00eda a la larga). La lista corta avanza de a uno,\nla lista larga usa galloping para saltar.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c5d7512877ea635ee5c5b451c744ae4b", "console": [], "id": "nHfw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"interfaz-abstracta-de-postinglist-estrategia-de-busqueda\"\u003EInterfaz abstracta de PostingList + Estrategia de b\u00fasqueda\u003C/h3\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"kn\"\u003Efrom\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nn\"\u003Eabc\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"kn\"\u003Eimport\u003C/span\u003E \u003Cspan class=\"n\"\u003EABC\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Eabstractmethod\u003C/span\u003E\n\u003Cspan class=\"kn\"\u003Efrom\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nn\"\u003Etyping\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"kn\"\u003Eimport\u003C/span\u003E \u003Cspan class=\"n\"\u003EOptional\u003C/span\u003E\n\n\u003Cspan class=\"kn\"\u003Efrom\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nn\"\u003Eenum\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"kn\"\u003Eimport\u003C/span\u003E \u003Cspan class=\"n\"\u003EEnum\u003C/span\u003E\n\n\u003Cspan class=\"k\"\u003Eclass\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nc\"\u003EMethod\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003EEnum\u003C/span\u003E\u003Cspan class=\"p\"\u003E):\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003ENAIVE\u003C/span\u003E     \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"s2\"\u003E\u0026quot;naive\u0026quot;\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003EBINARY\u003C/span\u003E    \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"s2\"\u003E\u0026quot;binary\u0026quot;\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003EGALLOPING\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"s2\"\u003E\u0026quot;galloping\u0026quot;\u003C/span\u003E\n\n\n\u003Cspan class=\"k\"\u003Eclass\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nc\"\u003EPostingList\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003EABC\u003C/span\u003E\u003Cspan class=\"p\"\u003E):\u003C/span\u003E\n\n    \u003Cspan class=\"nd\"\u003E@abstractmethod\u003C/span\u003E\n    \u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Edocid\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"n\"\u003EOptional\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"nb\"\u003Eint\u003C/span\u003E\u003Cspan class=\"p\"\u003E]:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;docID actual; None si cursor = -1 (lista agotada).\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Epass\u003C/span\u003E\n\n    \u003Cspan class=\"nd\"\u003E@abstractmethod\u003C/span\u003E\n    \u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Eweight\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"n\"\u003EOptional\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"nb\"\u003Efloat\u003C/span\u003E\u003Cspan class=\"p\"\u003E]:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;Peso del documento actual (TF-IDF, BM25, etc.).\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Epass\u003C/span\u003E\n\n    \u003Cspan class=\"nd\"\u003E@abstractmethod\u003C/span\u003E\n    \u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Enext\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"kc\"\u003ENone\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;Avanza al siguiente documento. Cursor \u2192 -1 si no hay m\u00e1s.\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Epass\u003C/span\u003E\n\n    \u003Cspan class=\"nd\"\u003E@abstractmethod\u003C/span\u003E\n    \u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Ege\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Edocid\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"nb\"\u003Eint\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"nb\"\u003Eint\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n\u003Cspan class=\"sd\"\u003E        Retorna el primer docID \u0026gt;= docid usando la estrategia configurada.\u003C/span\u003E\n\u003Cspan class=\"sd\"\u003E        Mueve el cursor a esa posici\u00f3n (o a -1 si no existe).\u003C/span\u003E\n\u003Cspan class=\"sd\"\u003E        \u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Eif\u003C/span\u003E \u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Ecursor\u003C/span\u003E \u003Cspan class=\"o\"\u003E==\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n            \u003Cspan class=\"k\"\u003Ereturn\u003C/span\u003E \u003Cspan class=\"kc\"\u003ENone\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Eif\u003C/span\u003E \u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Esearch_method\u003C/span\u003E \u003Cspan class=\"o\"\u003E==\u003C/span\u003E \u003Cspan class=\"n\"\u003EMethod\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003EBINARY\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Evalue\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n            \u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003E_binary_search\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Edocid\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Eelif\u003C/span\u003E \u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Esearch_method\u003C/span\u003E \u003Cspan class=\"o\"\u003E==\u003C/span\u003E \u003Cspan class=\"n\"\u003EMethod\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u0 =\"nf\"\u003Ereset\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"bp\"\u003Eself\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"kc\"\u003ENone\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E        \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\u0026#39;\u0026#39;\u0026#39;Reinicia el cursor al inicio de la lista.\u0026#39;\u0026#39;\u0026#39;\u003C/span\u003E\n        \u003Cspan class=\"k\"\u003Epass\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "456211e1d7a3b7ab0cfa097e77c14a44", "console": [], "id": "xXTn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"6-operadores-booleanos-sobre-posting-lists\"\u003E6. Operadores Booleanos sobre Posting Lists\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ELos operadores booleanos se implementan como \u003Cstrong\u003Emerge algorithms\u003C/strong\u003E sobre\nposting lists ordenadas, aprovechando el modelo de cursor para recorrer\nambas listas en una sola pasada.\u003C/span\u003E\n\u003Ch3 id=\"and-interseccion\"\u003EAND \u2014 Intersecci\u00f3n\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EMantiene dos cursores sincronizados. En cada paso:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003ESi \u003Ccode\u003Ep.docid() == q.docid()\u003C/code\u003E \u2192 el docID est\u00e1 en ambas listas \u2192 agregar al resultado\u003C/li\u003E\n\u003Cli\u003ESi \u003Ccode\u003Ep.docid() \u0026lt; q.docid()\u003C/code\u003E \u2192 avanzar \u003Ccode\u003Ep\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003ESi \u003Ccode\u003Ep.docid() \u0026gt; q.docid()\u003C/code\u003E \u2192 avanzar \u003Ccode\u003Eq\u003C/code\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cdiv class=\"language-verilog codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"nl\"\u003Ep:\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"mh\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E33\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E99\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E\n\u003Cspan class=\"nl\"\u003Eq:\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E33\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E55\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E99\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E101\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E\n\n\u003Cspan class=\"n\"\u003Epaso\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E1\u003C/span\u003E\u003Cspan class=\"o\"\u003E:\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Ep\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"mh\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eq\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"mh\"\u003E1\u003C/span\u003E\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"err\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eigual\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"err\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eagregar\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eavanzar\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eambos\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Epaso\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E2\u003C/span\u003E\u003Cspan class=\"o\"\u003E:\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Ep\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"mh\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eq\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"mh\"\u003E33\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"err\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Ep\u003C/span\u003E\u003Cspan class=\"o\"\u003E\u0026lt;\u003C/span\u003E\u003Cspan class=\"n\"\u003Eq\u003C/span\u003E\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"err\"\u003E\u2192\u00 u003E\u003Cspan class=\"mh\"\u003E55\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"err\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Ep\u003C/span\u003E\u003Cspan class=\"o\"\u003E\u0026gt;\u003C/span\u003E\u003Cspan class=\"n\"\u003Eq\u003C/span\u003E\u003Cspan class=\"w\"\u003E  \u003C/span\u003E\u003Cspan class=\"err\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eavanzar\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eq\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Epaso\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E5\u003C/span\u003E\u003Cspan class=\"o\"\u003E:\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Ep\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"mh\"\u003E99\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"n\"\u003Eq\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"mh\"\u003E99\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"err\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eigual\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"err\"\u003E\u2192\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"n\"\u003Eagregar\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E99\u003C/span\u003E\n\n\u003Cspan class=\"nl\"\u003Eresultado:\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mh\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E33\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"mh\"\u003E99\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EComplejidad\u003C/strong\u003E: O(n\u2081 + n\u2082)\u003C/span\u003E\n\u003Ch3 id=\"or-union\"\u003EOR \u2014 Uni\u00f3n\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EAvanza siempre el cursor con el menor docID; si son iguales, avanza ambos.\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ep: [ 1, 2, 33, 99 ]\nq: [ 1, 33, 55, 99, 101 ]\n\nresultado: [1, 2, 33, 55, 99, 101]\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EComplejidad\u003C/strong\u003E: O(n\u2081 + n\u2082)\u003C/span\u003E\n\u003Ch3 id=\"not-diferencia-de-conjuntos\"\u003ENOT \u2014 Diferencia de conjuntos\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EEl \u003Cstrong\u003ENOT\u003C/strong\u003E en IR es \u003Cstrong\u003Ediferencia de conjuntos\u003C/strong\u003E, no complemento absoluto.\n\u003Ccode\u003ENOT p\u003C/code\u003E respecto de un universo \u003Ccode\u003Eq\u003C/code\u003E retorna los docIDs en \u003Ccode\u003Eq\u003C/code\u003E que \u003Cstrong\u003Eno\u003C/strong\u003E est\u00e1n en \u003Ccode\u003Ep\u003C/code\u003E:\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003ENOT p IN q  \u2261  q \\ p  (diferencia de conjuntos)\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EAlgoritmo: recorrer \u003Ccode\u003Eq\u003C/code\u003E; para cada docID en \u003Ccode\u003Eq\u003C/code\u003E, verificar con \u003Ccode\u003Ep.ge()\u003C/code\u003E si est\u00e1 en \u003Ccode\u003Ep\u003C/code\u003E.\nSi \u003Ccode\u003Ep.ge(current) \u2260 current\u003C/code\u003E \u2192 no est\u00e1 en \u003Ccode\u003Ep\u003C/code\u003E \u2192 incluir en el resultado.\u003C/span\u003E\n\u003Cdiv class=\"language-text codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Ep: [1, 33, 55, 99, 101, 120]   (el conjunto a negar)\nq: [1, 2, 33, 99]              (el universo local)\n\nq=1:  p.ge(1)=1   \u2192 1 \u2208 p   \u2192 NO incluir\nq=2:  p.ge(2)=33  \u2192 2 \u2209 p   \u2192 incluir 2\nq=33: p.ge(33)=33 \u2192 33 \u2208 p  \u2192 NO incluir\nq=99: p.ge(99)=99 \u2192 99 \u2208 p  \u2192 NO incluir\n\nresultado: [2]\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ENota\u003C/strong\u003E: \u003Ccode\u003Ep.ge()\u003C/code\u003E s\u00f3lo avanza hacia adelante, y \u003Ccode\u003Eq\u003C/code\u003E tambi\u00e9n avanza \u2192\ncada elemento se examina a lo sumo una vez \u2192 \u003Cstrong\u003EO(n\u2081 + n\u2082)\u003C/strong\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "985a29d94caad4634c1f3f47bdc7fb40", "console": [], "id": "AjVT", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d6eaffc77ff9364b0b0952319fb79b8f", "console": [], "id": "pHFh", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ff4b20d6173d2d3926d8f277e5adbd91", "console": [], "id": "NCOB", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f1346422b1e1f07908c8464be0aa6479", "console": [], "id": "aqbW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"7-procesamiento-de-consultas-booleanas\"\u003E7. Procesamiento de Consultas Booleanas\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EPara evaluar expresiones como \u003Ccode\u003E((casa AND perro) AND (NOT gato))\u003C/code\u003E se usa\nun enfoque basado en una \u003Cstrong\u003Epila\u003C/strong\u003E (\u003Ccode\u003Edeque\u003C/code\u003E) y \u003Cstrong\u003Eevaluaci\u00f3n por par\u00e9ntesis\u003C/strong\u003E:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003ESe tokeniza la consulta separando \u003Ccode\u003E(\u003C/code\u003E y \u003Ccode\u003E)\u003C/code\u003E con espacios\u003C/li\u003E\n\u003Cli\u003E\n\u003Cspan class=\"paragraph\"\u003EPor cada s\u00edmbolo:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003E(\u003C/code\u003E \u2192 push en la pila\u003C/li\u003E\n\u003Cli\u003Et\u00e9rmino \u2192 resolver en el vocabulario \u2192 push su posting list\u003C/li\u003E\n\u003Cli\u003Eoperador (\u003Ccode\u003EAND\u003C/code\u003E, \u003Ccode\u003EOR\u003C/code\u003E, \u003Ccode\u003ENOT\u003C/code\u003E) \u2192 push el operador\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E)\u003C/code\u003E \u2192 \u003Cstrong\u003Eevaluar\u003C/strong\u003E: pop operandos y operador, push resultado\u003C/li\u003E\n\u003C/ul\u003E\n\u003C/li\u003E\n\u003Cli\u003EAl final, la pila contiene la lista de docIDs resultado\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EEl NOT se implementa como \u003Cstrong\u003Ediferencia de conjuntos\u003C/strong\u003E respecto al universo\nde documentos de la colecci\u00f3n.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a91196994c5cb3de2e70fc7c8ac775cc", "console": [], "id": "TRpd", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9c9a94a3eb71cb3435390610f809f9bf", "console": [], "id": "TXez", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6551d8ee7150a29ffba2017fac8fb75f", "console": [], "id": "dNNg", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"8-algoritmos-de-ranking-taat-y-daat\"\u003E8. Algoritmos de Ranking: TAAT y DAAT\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EEn el \u003Cstrong\u003Emodelo vectorial\u003C/strong\u003E (TF-IDF, BM25), el score de un documento \u003Ccode\u003Ed\u003C/code\u003E\npara una consulta \u003Ccode\u003Eq\u003C/code\u003E es la suma de los pesos de los t\u00e9rminos de la consulta\nque aparecen en \u003Ccode\u003Ed\u003C/code\u003E:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\\text{score}(d, q) = \\sum_{t \\in q} w(t, d)||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EExisten dos estrategias principales para acumular estos scores:\u003C/span\u003E\n\u003Ch3 id=\"term-at-a-time-taat\"\u003ETerm-At-A-Time (TAAT)\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EProcesa \u003Cstrong\u003Eun t\u00e9rmino completo a la vez\u003C/strong\u003E. Para cada t\u00e9rmino recorre su\nposting list y acumula el score en un diccionario \u003Ccode\u003Eacc[docid]\u003C/code\u003E.\u003C/span\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"n\"\u003Eacc\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"p\"\u003E{}\u003C/span\u003E\n\u003Cspan class=\"k\"\u003Efor\u003C/span\u003E \u003Cspan class=\"n\"\u003Ecada\u003C/span\u003E \u003Cspan class=\"n\"\u003Et\u00e9rmino\u003C/span\u003E \u003Cspan class=\"n\"\u003Et\u003C/span\u003E \u003Cspan class=\"n\"\u003Een\u003C/span\u003E \u003Cspan class=\"n\"\u003Ela\u003C/span\u003E \u003Cspan class=\"n\"\u003Econsulta\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Epara\u003C/span\u003E \u003Cspan class=\"n\"\u003Ecada\u003C/span\u003E \u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Edocid\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Eweight\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E \u003Cspan class=\"n\"\u003Een\u003C/span\u003E \u003Cspan class=\"n\"\u003Eposting_list\u003C/span\u003E
